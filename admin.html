<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - PMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f0f5fc; --glass-bg:rgba(255,255,255,0.65); --glass-border:rgba(255,255,255,0.7); --accent:#2a6fdb; --text-dark:#0b1e33; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:linear-gradient(to bottom, #1b3b6f 0%, #4a7fb5 20%, #c0daf5 40%, #ffffff 50%, #c0daf5 60%, #4a7fb5 80%, #1b3b6f 100%);color:var(--text-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .glass{background:var(--glass-bg);backdrop-filter:blur(15px);border:1px solid var(--glass-border);border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.1);}
    #loginScreen{display:flex;justify-content:center;align-items:center;width:100%;}
    .login-box{padding:40px;width:350px;text-align:center}
    .login-box h2{color:var(--accent);font-family:'Orbitron',sans-serif;margin-bottom:20px}
    .login-box input{width:100%;padding:12px;margin-bottom:15px;background:rgba(255,255,255,0.8);border:1px solid #ccc;color:#000;border-radius:8px;font-size:1rem;}
    .login-box button{width:100%;padding:12px;background:var(--accent);color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
    #adminPanel{max-width:900px;margin:20px auto;padding:20px;display:none;width:100%;}
    header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;margin-bottom:25px;background:rgba(255,255,255,0.7);border-radius:20px;}
    header h1{font-family:'Orbitron',sans-serif;color:var(--accent);font-size:1.5rem}
    #logoutBtn{background:transparent;border:1px solid #ff4444;color:#ff4444;padding:8px 20px;border-radius:20px;cursor:pointer}
    .add-product{padding:25px;margin-bottom:30px;background:rgba(255,255,255,0.65);backdrop-filter:blur(15px);border-radius:20px;border:1px solid rgba(255,255,255,0.7);}
    .add-product h2{color:var(--accent);margin-bottom:20px}
    .add-product label{display:block;margin:10px 0 5px;font-size:0.9rem}
    .add-product input,.add-product textarea{width:100%;padding:10px;background:rgba(255,255,255,0.9);border:1px solid #ccc;color:#000;border-radius:8px;margin-bottom:10px}
    .add-btn{background:var(--accent);color:white;border:none;padding:12px 25px;border-radius:30px;font-weight:bold;cursor:pointer;margin-top:10px}
    .product-list{padding:25px;background:rgba(255,255,255,0.65);backdrop-filter:blur(15px);border-radius:20px;border:1px solid rgba(255,255,255,0.7);margin-top:20px;}
    .product-list h2{color:var(--accent);margin-bottom:20px}
    table{width:100%;border-collapse:collapse}
    th{text-align:left;padding:10px;background:rgba(0,0,0,0.05);color:var(--text-dark)}
    td{padding:10px;border-bottom:1px solid #ccc}
    .delete-btn{background:#ff4444;border:none;color:white;padding:6px 12px;border-radius:20px;cursor:pointer}
  </style>
</head>
<body>
  <div id="loginScreen">
    <div class="login-box glass">
      <h2>🔐 Admin Login</h2>
      <input type="email" id="email" placeholder="Email" value="admin@pmc.com">
      <input type="password" id="password" placeholder="Password" value="pmc2026">
      <button id="loginBtn">Login</button>
      <p id="loginMsg" style="color:red;"></p>
    </div>
  </div>

  <div id="adminPanel">
    <header class="glass">
      <h1>🛠️ PMC Admin Dashboard</h1>
      <button id="logoutBtn">Logout</button>
    </header>
    <main>
      <section class="add-product">
        <h2>➕ Add Product</h2>
        <form id="addProductForm">
          <label>Name *</label><input type="text" name="name" required>
          <label>Category</label><input type="text" name="category" placeholder="e.g. Laptop, Phone, Game" list="catList">
          <datalist id="catList"><option value="Laptop"><option value="Phone"><option value="Game"><option value="Accessory"><option value="TV"><option value="Other"></datalist>
          <label>Price (₦) *</label><input type="number" name="price" required min="1">
          <label>Description</label><textarea name="description" rows="2"></textarea>
          <label>Image URLs * (one per line, first is main)</label>
          <textarea name="images" rows="4" required placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.jpg"></textarea>
          <small style="color:#555;">Paste direct image links (Imgur etc.)</small>
          <button type="submit" class="add-btn">🚀 Add Product</button>
          <p id="addMsg" style="color:green;"></p>
        </form>
      </section>

      <section class="product-list">
        <h2>📦 Inventory</h2>
        <table id="productTable">
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Action</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'pmcProducts';
    const LOGIN_KEY = 'pmcAdminLoggedIn';
    const VALID_EMAIL = 'admin@pmc.com';
    const VALID_PASS = 'pmc2026';

    if (sessionStorage.getItem(LOGIN_KEY) === 'true') { showPanel(); renderTable(); }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (email === VALID_EMAIL && pass === VALID_PASS) {
        sessionStorage.setItem(LOGIN_KEY, 'true');
        showPanel(); renderTable();
      } else {
        document.getElementById('loginMsg').textContent = 'Invalid email or password.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem(LOGIN_KEY);
      document.getElementById('adminPanel').style.display='none';
      document.getElementById('loginScreen').style.display='flex';
    });

    function showPanel() {
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('adminPanel').style.display='block';
    }

    function getProducts() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    function saveProducts(arr) { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

    function renderTable() {
      const products = getProducts();
      document.querySelector('#productTable tbody').innerHTML = products.map(p => `
        <tr>
          <td><img src="${p.images?.[0] || ''}" width="50" onerror="this.style.display='none'"></td>
          <td>${p.name}</td><td>${p.category||'-'}</td><td>₦${p.price.toLocaleString()}</td>
          <td><button class="delete-btn" data-id="${p.id}">🗑 Delete</button></td>
        </tr>`).join('');
      document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => {
        if (!confirm('Delete?')) return;
        let prods = getProducts().filter(p => p.id !== Number(e.target.dataset.id));
        saveProducts(prods); renderTable();
      }));
    }

    document.getElementById('addProductForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const category = e.target.category.value.trim() || 'Other';
      const price = Number(e.target.price.value);
      const description = e.target.description.value.trim();
      const imagesRaw = e.target.images.value.trim();
      if (!name || !price || !imagesRaw) {
        document.getElementById('addMsg').textContent = '❌ Name, price, and at least one image required.';
        return;
      }
      const images = imagesRaw.split('\n').map(u => u.trim()).filter(u => u);
      if (!images.length) { document.getElementById('addMsg').textContent = '❌ No valid image URLs.'; return; }
      const newProduct = { id: Date.now(), name, category, price, description, images };
      const products = getProducts();
      products.push(newProduct);
      saveProducts(products);
      document.getElementById('addMsg').textContent = `✅ ${name} added!`;
      e.target.reset();
      renderTable();
    });
  </script>
</body>
</html>
